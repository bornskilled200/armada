# xone_dongle composes the firmware name at runtime ("xone_dongle_%04x.bin"),
# so dracut's modinfo-based firmware introspection cannot see it. Pin the
# Xbox Wireless Dongle (MT76) blobs explicitly so a dongle works from
# initramfs (installer / fallback console).
install_items+="/usr/lib/firmware/xone_dongle_02e6.bin /usr/lib/firmware/xone_dongle_02fe.bin /usr/lib/firmware/xone_dongle_02f9.bin /usr/lib/firmware/xone_dongle_091e.bin"
