# xone (dlundqvist/xone, GIP) takes over Xbox One/Series: wired USB via
# xone_wired and the Xbox Wireless Dongle via xone_dongle. Per the xone
# README, the in-tree xpad must stay disabled so the two do not fight over
# the same USB ids; Xbox 360 / 360 Wireless is covered by xpad-noone.
blacklist xpad
# mt76x2u would grab the Xbox Wireless Dongle (MT76x2 chipset) first.
blacklist mt76x2u
